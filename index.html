<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reading List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 My Book Reading List</h1>
        <p class="subtitle">Keep track of books you want to read.</p>

        <div class="input-section">
            <input
                type="text"
                id="book-input"
                placeholder="Enter a book title"
            >
            <button id="add-btn">Add Book</button>
        </div>

        <div class="stats">
            <span>Total Books: <strong id="total-count">0</strong></span>
            <span>Completed: <strong id="completed-count">0</strong></span>
        </div>

        <ul id="book-list"></ul>

        <p id="empty-message">No books added yet.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
